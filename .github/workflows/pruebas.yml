name: Pruebas

on:
  push:
  pull_request:

jobs:
  unitarias:
    name: Pruebas unitarias y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook -- --quiet

  e2e:
    name: Pruebas de extremo a extremo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: scv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: test
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Descargar el backend de la misma rama (o develop)
        run: |
          git clone --depth 1 -b "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/mateomerino14/SCV-Backend.git backend \
            || git clone --depth 1 -b develop https://github.com/mateomerino14/SCV-Backend.git backend
      - name: Crear la base de prueba
        run: |
          for script in 01_schema 02_functions 03_seed 04_rls_hardening testing_02_organizacion_prueba; do
            psql -h localhost -U postgres -d scv_test -v ON_ERROR_STOP=1 -q -f backend/database/$script.sql
          done
      - name: Levantar PostgREST y el backend
        env:
          PORT: 5055
          SUPABASE_URL: http://localhost:3998
          SUPABASE_KEY: clave-de-prueba
          JWT_SECRET: secreto-de-prueba
          JWT_REFRESH_SECRET: secreto-de-refresco-de-prueba
          CORS_ORIGINS: http://localhost:5173
          FRONTEND_URL: http://localhost:5173
        run: |
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar -xJ
          printf 'db-uri = "postgres://postgres:test@localhost:5432/scv_test"\ndb-schemas = "public"\ndb-anon-role = "postgres"\nserver-port = 3999\n' > postgrest.conf
          ./postgrest postgrest.conf > postgrest.log 2>&1 &
          cd backend && npm ci && (node tests/support/supabaseProxy.js > ../proxy.log 2>&1 &) && (node src/index.js > ../backend.log 2>&1 &)
          sleep 5
      - run: npm ci
      - name: Levantar el frontend
        env:
          VITE_API_URL: http://localhost:5055
        run: |
          (npx vite --port 5173 > vite.log 2>&1 &)
          npx wait-on -t 60000 tcp:5173 tcp:5055
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Guardar el reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-e2e
          path: |
            playwright-report
            test-results
            *.log
